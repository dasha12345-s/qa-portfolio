name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install app dependencies
        run: yarn install
        working-directory: cypress-realworld-app

      - name: Start dev server
        run: yarn --cwd cypress-realworld-app dev &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000

      - name: Install test dependencies
        run: npm ci
        working-directory: playwrightRealWorldAppTests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: playwrightRealWorldAppTests

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        working-directory: playwrightRealWorldAppTests

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwrightRealWorldAppTests/playwright-report/
          if-no-files-found: ignore
